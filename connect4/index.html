<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --cell-size: 60px;
            --cell-margin: 4px;
            --cell-total: calc(var(--cell-size) + var(--cell-margin) * 2);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background: black;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }
        #status {
            font-size: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: 15px;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            text-align: center;
        }
        #status .red { color: #ff6b6b; }
        #status .white { color: #fff; }
        #board {
            background: #0066cc;
            padding: clamp(6px, 2vw, 10px);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 100%;
        }
        .row {
            display: flex;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            margin: var(--cell-margin);
            border-radius: 50%;
            background: black;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        .cell.red {
            background: #ff6b6b;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        .cell.white {
            background: #fff;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        .cell.column-highlight:not(.red):not(.white) {
            background: #333;
        }
        .cell.winning {
            animation: pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .cell.dropping {
            animation: drop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes drop {
            from {
                transform: translateY(calc(var(--cell-total) * -1 * (var(--drop-distance) + 1)));
            }
            to {
                transform: translateY(0);
            }
        }
        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #4ecdc4;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover {
            background: #45b7aa;
            transform: scale(1.05);
        }
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            align-items: stretch;
        }
        .button-row .btn {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #scoreboard {
            display: flex;
            gap: clamp(20px, 5vw, 40px);
            margin-bottom: 15px;
            font-size: clamp(1rem, 3vw, 1.2rem);
        }
        .score {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        .score-dot.red { background: #ff6b6b; }
        .score-dot.white { background: #fff; }
        .score-value {
            font-weight: bold;
            min-width: 20px;
        }
        #timer {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            margin-bottom: 10px;
            color: #aaa;
        }

        /* Menu overlay */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #menu-overlay.hidden {
            display: none;
        }
        .menu-title {
            font-size: clamp(2rem, 8vw, 3rem);
            margin-bottom: 40px;
            color: #4ecdc4;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 280px;
        }
        .menu-buttons .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
        }

        /* Online game UI */
        #online-setup {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }
        #online-setup.active {
            display: flex;
        }
        .room-code-display {
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
        }
        .room-code-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        .room-code {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #4ecdc4;
            font-family: monospace;
        }
        .room-code-input {
            padding: 15px 20px;
            font-size: 1.5rem;
            border: 2px solid #4ecdc4;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            letter-spacing: 4px;
            font-family: monospace;
            width: 200px;
            text-transform: uppercase;
        }
        .room-code-input::placeholder {
            color: #666;
            letter-spacing: 2px;
        }
        .connection-status {
            font-size: 0.9rem;
            color: #aaa;
        }
        .connection-status.connected {
            color: #4ecdc4;
        }
        .connection-status.error {
            color: #ff6b6b;
        }

        /* Game info bar */
        #game-info {
            display: none;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #aaa;
        }
        #game-info.active {
            display: flex;
        }
        .your-color {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .color-indicator.red { background: #ff6b6b; }
        .color-indicator.white { background: #fff; }

        /* Notification dialog */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .dialog-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .dialog {
            background: #1a1a2e;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        .dialog-overlay.visible .dialog {
            transform: scale(1);
        }
        .dialog-message {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Mobile responsive - scale cells based on viewport */
        @media (max-width: 520px) {
            :root {
                --cell-size: calc((100vw - 40px) / 7 - 8px);
                --cell-margin: 3px;
            }
        }

        /* Very small screens */
        @media (max-width: 360px) {
            :root {
                --cell-margin: 2px;
                --cell-size: calc((100vw - 30px) / 7 - 4px);
            }
        }
    </style>
</head>
<body>
    <!-- Notification Dialog -->
    <div id="dialog-overlay" class="dialog-overlay">
        <div class="dialog">
            <div class="dialog-message" id="dialog-message">Opponent restarted the game</div>
            <button class="btn" onclick="closeDialog()">OK</button>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menu-overlay">
        <h1 class="menu-title">Connect 4</h1>
        <div id="mode-select" class="menu-buttons">
            <button class="btn" onclick="startLocalGame()">Local Game</button>
            <button class="btn" onclick="showHostGame()">Host Online Game</button>
            <button class="btn" onclick="showJoinGame()">Join Online Game</button>
        </div>
        <div id="online-setup">
            <div id="host-setup">
                <div class="room-code-display">
                    <div class="room-code-label">Share this code with your opponent:</div>
                    <div class="room-code" id="room-code">----</div>
                </div>
            </div>
            <div id="join-setup" style="display: none;">
                <input type="text" class="room-code-input" id="join-code-input" placeholder="CODE" maxlength="4" autocomplete="off">
            </div>
            <div class="connection-status" id="connection-status">Connecting...</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="join-btn" style="display: none;" onclick="joinGame()">Join</button>
                <button class="btn btn-secondary" onclick="backToMenu()">Back</button>
            </div>
        </div>
    </div>

    <h1>Connect 4</h1>
    <div id="game-info">
        <span class="your-color">You are: <span class="color-indicator" id="your-color-indicator"></span> <span id="your-color-name"></span></span>
        <span id="opponent-status"></span>
    </div>
    <div id="scoreboard">
        <div class="score"><div class="score-dot red"></div> Red: <span id="red-score" class="score-value">0</span></div>
        <div class="score"><div class="score-dot white"></div> White: <span id="white-score" class="score-value">0</span></div>
    </div>
    <div id="timer">Time: 0:00</div>
    <div id="status">Current Player: <span class="red">Red</span></div>
    <div id="board"></div>
    <div class="button-row">
        <button id="restart" class="btn">Restart Game</button>
        <button id="leave-game" class="btn btn-secondary" style="display: none;" onclick="leaveGame()">Leave Game</button>
    </div>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = [];
        let currentPlayer = 'red';
        let gameOver = false;
        let scores = { red: 0, white: 0 };
        let timerInterval = null;
        let startTime = null;

        // Online game state
        let peer = null;
        let conn = null;
        let isOnlineGame = false;
        let myColor = null;
        let roomCode = null;
        let isHost = false;
        let nextStartingPlayer = 'red'; // Track who goes first next game

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function showHostGame() {
            document.getElementById('mode-select').style.display = 'none';
            document.getElementById('online-setup').classList.add('active');
            document.getElementById('host-setup').style.display = 'block';
            document.getElementById('join-setup').style.display = 'none';
            document.getElementById('join-btn').style.display = 'none';

            isHost = true;
            roomCode = generateRoomCode();
            document.getElementById('room-code').textContent = roomCode;
            document.getElementById('connection-status').textContent = 'Waiting for opponent...';
            document.getElementById('connection-status').className = 'connection-status';

            initPeer(roomCode);
        }

        function showJoinGame() {
            document.getElementById('mode-select').style.display = 'none';
            document.getElementById('online-setup').classList.add('active');
            document.getElementById('host-setup').style.display = 'none';
            document.getElementById('join-setup').style.display = 'block';
            document.getElementById('join-btn').style.display = 'block';

            isHost = false;
            document.getElementById('join-code-input').value = '';
            document.getElementById('join-code-input').focus();
            document.getElementById('connection-status').textContent = 'Enter the room code';
            document.getElementById('connection-status').className = 'connection-status';
        }

        function backToMenu() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            conn = null;
            document.getElementById('mode-select').style.display = 'flex';
            document.getElementById('online-setup').classList.remove('active');
        }

        function initPeer(id) {
            const peerId = 'connect4-' + id;
            peer = new Peer(peerId);

            peer.on('open', () => {
                console.log('Peer connected with ID:', peerId);
                if (isHost) {
                    document.getElementById('connection-status').textContent = 'Waiting for opponent...';
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'unavailable-id') {
                    document.getElementById('connection-status').textContent = 'Room code already in use. Try again.';
                    document.getElementById('connection-status').className = 'connection-status error';
                    if (isHost) {
                        roomCode = generateRoomCode();
                        document.getElementById('room-code').textContent = roomCode;
                        peer.destroy();
                        setTimeout(() => initPeer(roomCode), 500);
                    }
                } else if (err.type === 'peer-unavailable') {
                    document.getElementById('connection-status').textContent = 'Room not found. Check the code.';
                    document.getElementById('connection-status').className = 'connection-status error';
                } else {
                    document.getElementById('connection-status').textContent = 'Connection error. Try again.';
                    document.getElementById('connection-status').className = 'connection-status error';
                }
            });
        }

        function joinGame() {
            const code = document.getElementById('join-code-input').value.toUpperCase().trim();
            if (code.length !== 4) {
                document.getElementById('connection-status').textContent = 'Enter a 4-character code';
                document.getElementById('connection-status').className = 'connection-status error';
                return;
            }

            roomCode = code;
            document.getElementById('connection-status').textContent = 'Connecting...';
            document.getElementById('connection-status').className = 'connection-status';

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect('connect4-' + code);
                conn.on('open', () => {
                    setupConnection();
                });
                conn.on('error', (err) => {
                    document.getElementById('connection-status').textContent = 'Failed to connect';
                    document.getElementById('connection-status').className = 'connection-status error';
                });
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'peer-unavailable') {
                    document.getElementById('connection-status').textContent = 'Room not found. Check the code.';
                } else {
                    document.getElementById('connection-status').textContent = 'Connection error. Try again.';
                }
                document.getElementById('connection-status').className = 'connection-status error';
            });
        }

        function setupConnection() {
            document.getElementById('connection-status').textContent = 'Connected!';
            document.getElementById('connection-status').className = 'connection-status connected';

            // Host is always red, joiner is always white
            myColor = isHost ? 'red' : 'white';

            conn.on('data', (data) => {
                handlePeerData(data);
            });

            conn.on('close', () => {
                handleDisconnect();
            });

            // Start the game after a short delay
            setTimeout(() => {
                startOnlineGame();
            }, 500);
        }

        function showDialog(message) {
            document.getElementById('dialog-message').textContent = message;
            document.getElementById('dialog-overlay').classList.add('visible');
        }

        function closeDialog() {
            document.getElementById('dialog-overlay').classList.remove('visible');
        }

        function handlePeerData(data) {
            switch(data.type) {
                case 'move':
                    receiveMove(data.col);
                    break;
                case 'restart':
                    // Opponent confirmed restart
                    resetBoard();
                    showDialog('Opponent restarted the game');
                    break;
                case 'restart-request':
                    // Opponent wants to restart, auto-accept
                    sendData({ type: 'restart' });
                    resetBoard();
                    showDialog('Opponent restarted the game');
                    break;
            }
        }

        function sendData(data) {
            if (conn && conn.open) {
                conn.send(data);
            }
        }

        function handleDisconnect() {
            document.getElementById('opponent-status').textContent = '(Opponent disconnected)';
            document.getElementById('opponent-status').style.color = '#ff6b6b';
            // Don't end the game, let them reconnect or leave
        }

        function startLocalGame() {
            isOnlineGame = false;
            myColor = null;
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('game-info').classList.remove('active');
            document.getElementById('leave-game').style.display = 'none';
            initBoard();
        }

        function startOnlineGame() {
            isOnlineGame = true;
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('game-info').classList.add('active');
            document.getElementById('leave-game').style.display = 'block';

            // Show player's color
            document.getElementById('your-color-indicator').className = 'color-indicator ' + myColor;
            document.getElementById('your-color-name').textContent = myColor.charAt(0).toUpperCase() + myColor.slice(1);
            document.getElementById('opponent-status').textContent = '';

            // Reset scores for new online game
            scores = { red: 0, white: 0 };
            updateScoreboard();

            // First game of session starts with red
            nextStartingPlayer = 'red';
            initBoard(true);
        }

        function leaveGame() {
            if (conn) {
                conn.close();
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            conn = null;
            isOnlineGame = false;
            myColor = null;
            document.getElementById('menu-overlay').classList.remove('hidden');
            document.getElementById('mode-select').style.display = 'flex';
            document.getElementById('online-setup').classList.remove('active');
            document.getElementById('game-info').classList.remove('active');
            document.getElementById('leave-game').style.display = 'none';
        }

        function initBoard(useNextStarter = false) {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            if (useNextStarter) {
                currentPlayer = nextStartingPlayer;
            } else {
                currentPlayer = Math.random() < 0.5 ? 'red' : 'white';
                nextStartingPlayer = currentPlayer;
            }
            gameOver = false;
            stopTimer();
            document.getElementById('timer').textContent = 'Time: 0:00';
            render();
            updateStatus();
        }

        function resetBoard() {
            // Alternate who goes first
            nextStartingPlayer = nextStartingPlayer === 'red' ? 'white' : 'red';
            initBoard(true);
        }

        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';

                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c]) {
                        cell.classList.add(board[r][c]);
                    }

                    cell.addEventListener('click', () => handleClick(c));
                    cell.addEventListener('mouseenter', () => highlightColumn(c));
                    cell.addEventListener('mouseleave', clearColumnHighlight);

                    rowEl.appendChild(cell);
                }
                boardEl.appendChild(rowEl);
            }
        }

        function highlightColumn(col) {
            if (gameOver) return;
            // In online mode, only highlight if it's your turn
            if (isOnlineGame && currentPlayer !== myColor) return;

            clearColumnHighlight();
            document.querySelectorAll(`.cell[data-col="${col}"]`).forEach(cell => {
                cell.classList.add('column-highlight');
            });
        }

        function clearColumnHighlight() {
            document.querySelectorAll('.cell.column-highlight').forEach(cell => {
                cell.classList.remove('column-highlight');
            });
        }

        function handleClick(col) {
            if (gameOver) return;

            // In online mode, only allow moves on your turn
            if (isOnlineGame && currentPlayer !== myColor) return;

            // Start timer on first move
            if (!timerInterval) {
                startTimer();
            }

            const row = makeMove(col);
            if (row === -1) return;

            // Send move to opponent
            if (isOnlineGame) {
                sendData({ type: 'move', col: col });
            }
        }

        function receiveMove(col) {
            if (gameOver) return;

            // Start timer if not started
            if (!timerInterval) {
                startTimer();
            }

            makeMove(col);
        }

        function makeMove(col) {
            // Find the lowest empty row in this column
            let row = -1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][col]) {
                    row = r;
                    break;
                }
            }

            if (row === -1) return -1; // Column is full

            board[row][col] = currentPlayer;

            // Animate the piece dropping
            const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cell.style.setProperty('--drop-distance', row);
            cell.classList.add(currentPlayer, 'dropping');
            cell.classList.remove('column-highlight');

            const winner = checkWinner(row, col);
            if (winner) {
                gameOver = true;
                stopTimer();
                scores[currentPlayer]++;
                updateScoreboard();
                setTimeout(() => highlightWinningCells(winner), 500);
                updateStatus(currentPlayer + ' wins!');
                return row;
            }

            if (isBoardFull()) {
                gameOver = true;
                stopTimer();
                updateStatus("It's a draw!");
                return row;
            }

            currentPlayer = currentPlayer === 'red' ? 'white' : 'red';
            updateStatus();
            return row;
        }

        function updateStatus(message) {
            const statusEl = document.getElementById('status');
            if (message) {
                const colorClass = message.includes('red') ? 'red' : message.includes('white') ? 'white' : '';
                statusEl.innerHTML = `<span class="${colorClass}">${message.charAt(0).toUpperCase() + message.slice(1)}</span>`;
            } else {
                let statusText = `Current Player: <span class="${currentPlayer}">${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}</span>`;
                if (isOnlineGame) {
                    if (currentPlayer === myColor) {
                        statusText += ' (Your turn)';
                    } else {
                        statusText += ' (Waiting...)';
                    }
                }
                statusEl.innerHTML = statusText;
            }
        }

        function updateScoreboard() {
            document.getElementById('red-score').textContent = scores.red;
            document.getElementById('white-score').textContent = scores.white;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function checkWinner(row, col) {
            const directions = [
                [[0, 1], [0, -1]],   // Horizontal
                [[1, 0], [-1, 0]],   // Vertical
                [[1, 1], [-1, -1]], // Diagonal \
                [[1, -1], [-1, 1]]  // Diagonal /
            ];

            const player = board[row][col];

            for (const [dir1, dir2] of directions) {
                const cells = [[row, col]];

                // Check in first direction
                let r = row + dir1[0];
                let c = col + dir1[1];
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                    cells.push([r, c]);
                    r += dir1[0];
                    c += dir1[1];
                }

                // Check in opposite direction
                r = row + dir2[0];
                c = col + dir2[1];
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                    cells.push([r, c]);
                    r += dir2[0];
                    c += dir2[1];
                }

                if (cells.length >= 4) {
                    return cells;
                }
            }

            return null;
        }

        function highlightWinningCells(cells) {
            for (const [r, c] of cells) {
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                if (cell) cell.classList.add('winning');
            }
        }

        function isBoardFull() {
            return board[0].every(cell => cell !== null);
        }

        document.getElementById('restart').addEventListener('click', () => {
            if (isOnlineGame) {
                sendData({ type: 'restart-request' });
            }
            resetBoard();
        });

        // Allow Enter key to join game
        document.getElementById('join-code-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinGame();
            }
        });

        // Don't auto-start, show menu first
    </script>
</body>
</html>
