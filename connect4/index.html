<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: black;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
        }
        #status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        #status .red { color: #ff6b6b; }
        #status .black { color: #fff; }
        #board {
            background: #0066cc;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .row {
            display: flex;
        }
        .cell {
            width: 60px;
            height: 60px;
            margin: 4px;
            border-radius: 50%;
            background: black;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        .cell.red {
            background: #ff6b6b;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        .cell.black {
            background: #fff;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        .cell.column-highlight:not(.red):not(.black) {
            background: #333;
        }
        .cell.winning {
            animation: pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .cell.dropping {
            animation: drop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes drop {
            from {
                transform: translateY(calc(-68px * (var(--drop-distance) + 1)));
            }
            to {
                transform: translateY(0);
            }
        }
        #restart {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #4ecdc4;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
        }
        #restart:hover {
            background: #45b7aa;
            transform: scale(1.05);
        }
        #scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .score {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        .score-dot.red { background: #ff6b6b; }
        .score-dot.black { background: #fff; }
        .score-value {
            font-weight: bold;
            min-width: 20px;
        }
        #timer {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Connect 4</h1>
    <div id="scoreboard">
        <div class="score"><div class="score-dot red"></div> Red: <span id="red-score" class="score-value">0</span></div>
        <div class="score"><div class="score-dot black"></div> Black: <span id="black-score" class="score-value">0</span></div>
    </div>
    <div id="timer">Time: 0:00</div>
    <div id="status">Current Player: <span class="red">Red</span></div>
    <div id="board"></div>
    <button id="restart">Restart Game</button>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = [];
        let currentPlayer = 'red';
        let gameOver = false;
        let scores = { red: 0, black: 0 };
        let timerInterval = null;
        let startTime = null;
        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            currentPlayer = Math.random() < 0.5 ? 'red' : 'black';
            gameOver = false;
            stopTimer();
            document.getElementById('timer').textContent = 'Time: 0:00';
            render();
            updateStatus();
        }

        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';

                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c]) {
                        cell.classList.add(board[r][c]);
                    }

                    cell.addEventListener('click', () => handleClick(c));
                    cell.addEventListener('mouseenter', () => highlightColumn(c));
                    cell.addEventListener('mouseleave', clearColumnHighlight);

                    rowEl.appendChild(cell);
                }
                boardEl.appendChild(rowEl);
            }
        }

        function highlightColumn(col) {
            if (gameOver) return;
            clearColumnHighlight();
            document.querySelectorAll(`.cell[data-col="${col}"]`).forEach(cell => {
                cell.classList.add('column-highlight');
            });
        }

        function clearColumnHighlight() {
            document.querySelectorAll('.cell.column-highlight').forEach(cell => {
                cell.classList.remove('column-highlight');
            });
        }

        function handleClick(col) {
            if (gameOver) return;

            // Start timer on first move
            if (!timerInterval) {
                startTimer();
            }

            // Find the lowest empty row in this column
            let row = -1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][col]) {
                    row = r;
                    break;
                }
            }

            if (row === -1) return; // Column is full

            board[row][col] = currentPlayer;

            // Animate the piece dropping
            const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cell.style.setProperty('--drop-distance', row);
            cell.classList.add(currentPlayer, 'dropping');
            cell.classList.remove('column-highlight');

            const winner = checkWinner(row, col);
            if (winner) {
                gameOver = true;
                stopTimer();
                scores[currentPlayer]++;
                updateScoreboard();
                setTimeout(() => highlightWinningCells(winner), 500);
                updateStatus(currentPlayer + ' wins!');
                return;
            }

            if (isBoardFull()) {
                gameOver = true;
                stopTimer();
                updateStatus("It's a draw!");
                return;
            }

            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';
            updateStatus();
        }

        function updateStatus(message) {
            const statusEl = document.getElementById('status');
            if (message) {
                const colorClass = message.includes('red') ? 'red' : message.includes('black') ? 'black' : '';
                statusEl.innerHTML = `<span class="${colorClass}">${message.charAt(0).toUpperCase() + message.slice(1)}</span>`;
            } else {
                statusEl.innerHTML = `Current Player: <span class="${currentPlayer}">${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}</span>`;
            }
        }

        function updateScoreboard() {
            document.getElementById('red-score').textContent = scores.red;
            document.getElementById('black-score').textContent = scores.black;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function checkWinner(row, col) {
            const directions = [
                [[0, 1], [0, -1]],   // Horizontal
                [[1, 0], [-1, 0]],   // Vertical
                [[1, 1], [-1, -1]], // Diagonal \
                [[1, -1], [-1, 1]]  // Diagonal /
            ];

            for (const [dir1, dir2] of directions) {
                const cells = [[row, col]];

                // Check in first direction
                let r = row + dir1[0];
                let c = col + dir1[1];
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === currentPlayer) {
                    cells.push([r, c]);
                    r += dir1[0];
                    c += dir1[1];
                }

                // Check in opposite direction
                r = row + dir2[0];
                c = col + dir2[1];
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === currentPlayer) {
                    cells.push([r, c]);
                    r += dir2[0];
                    c += dir2[1];
                }

                if (cells.length >= 4) {
                    return cells;
                }
            }

            return null;
        }

        function highlightWinningCells(cells) {
            for (const [r, c] of cells) {
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                if (cell) cell.classList.add('winning');
            }
        }

        function isBoardFull() {
            return board[0].every(cell => cell !== null);
        }

        document.getElementById('restart').addEventListener('click', initBoard);

        initBoard();
    </script>
</body>
</html>
